services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.1.0
    container_name: realtime-search-es
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    command: bash -c "if [ ! -d /usr/share/elasticsearch/plugins/analysis-kuromoji ]; then elasticsearch-plugin install analysis-kuromoji; fi; /usr/local/bin/docker-entrypoint.sh eswrapper"

  kibana:
    image: docker.elastic.co/kibana/kibana:9.1.0
    container_name: realtime-search-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch

volumes:
  es-data: